[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simpleipa"
version = "0.1.0"
description = "A simplified configuration and management layer for FreeIPA"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
simpleipa = "simpleipa.cli:main"

[tool.setuptools.packages.find]
include = ["simpleipa*"]
