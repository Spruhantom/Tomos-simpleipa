[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simpleipa"
version = "0.2.0"
description = "A simplified configuration and management layer for FreeIPA"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
]

[project.scripts]
simpleipa = "simpleipa.cli:main"

[tool.setuptools.packages.find]
include = ["simpleipa*"]
