name: tests

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm install
      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

  vm-lab-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Validate Vagrantfile syntax
        run: ruby -c tests/vm-lab/Vagrantfile
      - name: Validate VM provisioning scripts
        run: |
          bash -n tests/vm-lab/run.sh
          bash -n tests/vm-lab/scripts/server.sh
          bash -n tests/vm-lab/scripts/client.sh
